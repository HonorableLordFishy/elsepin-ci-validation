name: Swift tests

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run SessionPresentation tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-tests.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-tests-log
          path: swift-tests.log
